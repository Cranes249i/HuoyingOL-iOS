name: iOS Simulator smoke test

on:
  push:
    branches: [ air-ios ]
    paths:
      - 'probe/**'
      - 'src/**'
      - 'HuoyingOL-ios.xml'
      - 'MobileGame.swf'
      - '.github/workflows/simulator-smoke.yml'
  workflow_dispatch:
    inputs:
      air_version:
        description: AIR SDK version
        default: 51.5.1.1
        required: true

env:
  AIR_VERSION: ${{ github.event.inputs.air_version || '51.5.1.1' }}
  P12_PASSWORD: huoying

jobs:
  simulator:
    name: Probe + launcher in iOS Simulator
    runs-on: macos-15
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Download AIR SDK (macOS)
        run: |
          curl -fL --retry 5 --retry-delay 5 -o airsdk.zip \
            "https://airsdk.wxlift.com/api/versions/${AIR_VERSION}/sdks/AIRSDK_MacOS.zip?license=accepted"
          ls -l airsdk.zip
          mkdir -p airsdk
          unzip -q airsdk.zip -d airsdk
          chmod +x airsdk/bin/* || true
          ls airsdk airsdk/bin

      - name: Compile probe SWFs
        run: |
          AIR_SDK="$PWD/airsdk"
          if [ -x "$AIR_SDK/bin/mxmlc" ]; then MXMLC="$AIR_SDK/bin/mxmlc"; else MXMLC="java -jar $AIR_SDK/lib/compiler.jar mxmlc"; fi
          $MXMLC +configname=air -swf-version=51 -debug=false -output probe/Probe2.swf probe/Probe2.as
          $MXMLC +configname=air -swf-version=51 -debug=false -output probe/IosProbe.swf probe/IosProbe.as
          ls -l probe/*.swf

      - name: Compile launcher SWF from src
        run: |
          AIR_SDK="$PWD/airsdk"
          "$AIR_SDK/bin/mxmlc" +configname=air -swf-version=32 -debug=false -optimize=true \
            -source-path+=src -output MobileGame.swf src/MobileGame.as
          ls -l MobileGame.swf MobileGame.orig.swf

      - name: Signing material
        run: bash ./make-signing.sh cert

      - name: Package simulator builds
        run: |
          SIM_SDK="$(xcrun --sdk iphonesimulator --show-sdk-path)"
          echo "simulator sdk: $SIM_SDK"
          mkdir -p build
          java -jar airsdk/lib/adt.jar -version
          # ADT refuses its internal code-signing for simulator targets; signing is optional there.
          java -jar airsdk/lib/adt.jar -package -target ipa-test-interpreter-simulator \
            build/IosProbe-sim.ipa probe/IosProbe-app.xml -platformsdk "$SIM_SDK" -C probe IosProbe.swf Probe2.swf
          java -jar airsdk/lib/adt.jar -package -target ipa-test-interpreter-simulator \
            build/HuoyingOL-sim.ipa HuoyingOL-ios.xml -platformsdk "$SIM_SDK" MobileGame.swf qq-return.js icons
          ls -l build

      - name: Run in simulator
        run: |
          set -x
          xcrun simctl list devices available | head -n 40
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin); devs=sorted([x for r,v in d['devices'].items() if 'iOS' in r for x in v if x.get('isAvailable') and x['name'].startswith('iPhone')], key=lambda x: x['name']); print(devs[-1]['udid'])")
          echo "UDID=$UDID"
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          mkdir -p sim
          unzip -q build/IosProbe-sim.ipa -d sim/probe
          unzip -q build/HuoyingOL-sim.ipa -d sim/main
          xcrun simctl install "$UDID" sim/probe/Payload/IosProbe.app
          xcrun simctl install "$UDID" sim/main/Payload/HuoyingOL.app
          xcrun simctl spawn "$UDID" log stream --style compact --predicate 'processImagePath CONTAINS "IosProbe" OR processImagePath CONTAINS "HuoyingOL" OR eventMessage CONTAINS "PROBE"' > sim/syslog.txt 2>&1 &
          LOGPID=$!

          xcrun simctl launch "$UDID" local.huoying.probe
          sleep 25
          xcrun simctl io "$UDID" screenshot sim/probe-25s.png
          sleep 30
          xcrun simctl io "$UDID" screenshot sim/probe-55s.png
          sleep 25
          xcrun simctl io "$UDID" screenshot sim/probe-80s.png
          CONT=$(xcrun simctl get_app_container "$UDID" local.huoying.probe data || true)
          echo "probe container: $CONT"
          find "$CONT" -name 'probe-results.txt' -print -exec cat {} \; -exec cp {} sim/ \; || true
          xcrun simctl terminate "$UDID" local.huoying.probe || true

          xcrun simctl launch "$UDID" local.huoying.airgame
          sleep 12
          xcrun simctl io "$UDID" screenshot sim/main-12s.png
          sleep 18
          xcrun simctl io "$UDID" screenshot sim/main-30s.png
          sleep 30
          xcrun simctl io "$UDID" screenshot sim/main-60s.png
          sleep 30
          xcrun simctl io "$UDID" screenshot sim/main-90s.png
          CONT2=$(xcrun simctl get_app_container "$UDID" local.huoying.airgame data || true)
          echo "main container: $CONT2"
          find "$CONT2" -name 'air-diagnostics-*.jsonl' -print -exec cat {} \; -exec cp {} sim/ \; || true
          xcrun simctl terminate "$UDID" local.huoying.airgame || true
          sleep 2
          kill $LOGPID || true
          ls -l sim
          echo '--- syslog tail ---'
          tail -n 80 sim/syslog.txt || true

      - name: Upload simulator results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-smoke
          path: |
            sim/*.png
            sim/*.txt
            sim/*.jsonl
          retention-days: 14
